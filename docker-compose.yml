version: "3.9"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agatronic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agatronic}
      POSTGRES_DB: ${POSTGRES_DB:-agatronic_monitoring}
    volumes:
      - agatronic_db_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agatronic}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-agatronic}:${POSTGRES_PASSWORD:-agatronic}@db:5432/${POSTGRES_DB:-agatronic_monitoring}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-to-a-long-random-string}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      MODEL_PATH: /app/models/final_model.keras
      VIDEO_FOLDER: /app/videos
      DEFAULT_FRAME_INTERVAL_SECONDS: ${DEFAULT_FRAME_INTERVAL_SECONDS:-2.0}
      DEFAULT_CONFIDENCE_THRESHOLD: ${DEFAULT_CONFIDENCE_THRESHOLD:-0.75}
      DEFAULT_CONSECUTIVE_DETECTIONS: ${DEFAULT_CONSECUTIVE_DETECTIONS:-3}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: "true"
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-alerts@agatronic.com}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-3000}"]'
    volumes:
      - ./backend/models:/app/models
      - ./backend/videos:/app/videos           # dépose tes .mp4 ici (simulation caméra)
      - ./backend/reports:/app/reports
      - agatronic_static:/app/app/static
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}/api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  agatronic_db_data:
  agatronic_static:
